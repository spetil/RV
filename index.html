<html>
  <head>
    <title>Primeira experiencia de RA usando o AR</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- we import arjs version without NFT but with marker + location based support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  
  <body style="margin : 0px; overflow: hidden;">
    <a-scene vr-mode ul="embedded: false" embedded arjs="debugUIEnabled: false">
    <a-marker preset="hiro">
      <a-box position="0 0.5 0" color="blue"></a-box>
      <a-circle position="2 0 0" color="#CCC" radius="2"></a-circle>
      <a-cone position="-2 0 0"  color="tomato" radius-bottom="1" radius-top="0.5"></a-cone>

      
    </a-marker>
    <a-entity camera></a-entity>
  </body>
  
</html>
